server:
  port: 8082

spring:
  application:
    name: finance-service
  datasource:
    url: jdbc:postgresql://localhost:5432/finance_db
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  mvc:
    format:
      date: iso
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 86400000

internal:
  token: ${INTERNAL_TOKEN}

services:
  auth:
    url: http://localhost:8081
  report:
    url: http://localhost:8083

resilience4j:
  retry:
    instances:
      authService:
        max-attempts: 3
        wait-duration: 500ms
        retry-exceptions:
          - com.familyfinance.common.exception.ServiceUnavailableException

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
