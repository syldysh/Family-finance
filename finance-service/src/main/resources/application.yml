server:
  port: 8082

spring:
  application:
    name: finance-service
  datasource:
    url: jdbc:postgresql://localhost:5432/finance_db
    username: postgres
    password: REDACTED_DATABASE_PASSWORD
  mvc:
    format:
      date: iso
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  secret: REDACTED_JWT_SECRET
  expiration-ms: 86400000

services:
  auth:
    url: http://localhost:8081
  report:
    url: http://localhost:8083

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
