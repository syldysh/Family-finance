<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Отчеты - Family Finance</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <nav>
        <span class="brand">Family Finance</span>
        <a href="/dashboard">Главная</a>
        <a href="/operations">Операции</a>
        <a href="/family">Семья</a>
        <a href="/reports">Отчеты</a>
        <button class="logout" onclick="logout()">Выйти</button>
    </nav>

    <div class="container">
        <h1>Отчеты</h1>

        <div class="card">
            <h3>Параметры отчета</h3>
            <div class="filters">
                <label>С <input type="date" id="report-from"></label>
                <label>По <input type="date" id="report-to"></label>
                <label>Тип
                    <select id="report-type" onchange="onTypeChange()">
                        <option value="full">Все мои операции</option>
                        <option value="personal">Только личные</option>
                        <option value="family">По группе</option>
                    </select>
                </label>
                <label id="family-label" style="display:none">Группа
                    <select id="report-family">
                        <option value="">—</option>
                    </select>
                </label>
                <button onclick="buildReport()">Построить</button>
                <button onclick="exportCsv()">Скачать CSV</button>
            </div>
            <p id="report-error" class="error-msg"></p>
        </div>

        <div id="report-result" class="hidden">
            <div class="stats">
                <div class="stat-card">
                    <div class="value income" id="r-income">—</div>
                    <div class="label">Доходы</div>
                </div>
                <div class="stat-card">
                    <div class="value expense" id="r-expense">—</div>
                    <div class="label">Расходы</div>
                </div>
                <div class="stat-card">
                    <div class="value balance" id="r-balance">—</div>
                    <div class="label">Баланс</div>
                </div>
                <div class="stat-card">
                    <div class="value" id="r-count">—</div>
                    <div class="label">Операций</div>
                </div>
            </div>

            <div class="card">
                <h3>Доходы по категориям</h3>
                <table>
                    <thead><tr><th>Категория</th><th>Сумма</th></tr></thead>
                    <tbody id="income-categories"></tbody>
                </table>
            </div>

            <div class="card">
                <h3>Расходы по категориям</h3>
                <table>
                    <thead><tr><th>Категория</th><th>Сумма</th></tr></thead>
                    <tbody id="expense-categories"></tbody>
                </table>
            </div>

            <div class="card hidden" id="by-user-section">
                <h3>По участникам</h3>
                <table>
                    <thead><tr><th>ID пользователя</th><th>Доходы</th><th>Расходы</th><th>Баланс</th></tr></thead>
                    <tbody id="by-user-table"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="/app.js"></script>
    <script>
        if (!getToken()) window.location.href = '/login';

        const now = new Date();
        document.getElementById('report-from').value =
            new Date(now.getFullYear(), now.getMonth(), 1).toISOString().split('T')[0];
        document.getElementById('report-to').value = now.toISOString().split('T')[0];

        let userFamilyIds = [];

        async function loadFamilies() {
            const resp = await apiRequest('/api/families');
            if (!resp) return;
            const families = await resp.json();
            userFamilyIds = families.map(f => f.id);
            const sel = document.getElementById('report-family');
            families.forEach(f => {
                sel.innerHTML += '<option value="' + f.id + '">' + f.name + '</option>';
            });
        }

        function onTypeChange() {
            const type = document.getElementById('report-type').value;
            document.getElementById('family-label').style.display = type === 'family' ? '' : 'none';
            document.getElementById('report-error').textContent = '';
        }

        function getReportBody() {
            const type = document.getElementById('report-type').value;
            const body = {
                dateFrom: document.getElementById('report-from').value,
                dateTo: document.getElementById('report-to').value
            };
            if (type === 'family') {
                const familyId = document.getElementById('report-family').value;
                body.familyId = familyId ? parseInt(familyId) : null;
            } else if (type === 'full') {
                body.familyIds = userFamilyIds;
            }
            return body;
        }

        function getReportPath() {
            const type = document.getElementById('report-type').value;
            if (type === 'family') return '/api/reports/family';
            if (type === 'full') return '/api/reports/full';
            return '/api/reports/personal';
        }

        function validate() {
            const type = document.getElementById('report-type').value;
            const errEl = document.getElementById('report-error');
            const from = document.getElementById('report-from').value;
            const to = document.getElementById('report-to').value;

            if (!from || !to) {
                errEl.textContent = 'Укажите период';
                return false;
            }
            if (from > to) {
                errEl.textContent = 'Дата "С" не может быть позже даты "По"';
                return false;
            }
            if (type === 'family' && !document.getElementById('report-family').value) {
                errEl.textContent = 'Выберите группу для отчёта по группе';
                return false;
            }
            errEl.textContent = '';
            return true;
        }

        async function buildReport() {
            if (!validate()) return;
            try {
                const resp = await apiRequest(getReportPath(), {
                    method: 'POST',
                    body: JSON.stringify(getReportBody())
                });
                if (!resp) return;

                if (!resp.ok) {
                    const text = await resp.text();
                    let msg = 'Ошибка построения отчёта';
                    try { msg = JSON.parse(text).message || msg; } catch (e) {}
                    document.getElementById('report-error').textContent = msg;
                    return;
                }

                showReport(await resp.json());
            } catch (err) {
                document.getElementById('report-error').textContent = 'Ошибка: ' + err.message;
            }
        }

        function showReport(report) {
            document.getElementById('report-result').classList.remove('hidden');
            document.getElementById('r-income').textContent = formatMoney(report.totalIncome);
            document.getElementById('r-expense').textContent = formatMoney(report.totalExpense);
            document.getElementById('r-balance').textContent = formatMoney(report.balance);
            document.getElementById('r-count').textContent = report.transactionCount;

            fillCategoryTable('income-categories', report.incomeByCategory);
            fillCategoryTable('expense-categories', report.expenseByCategory);

            const byUserSection = document.getElementById('by-user-section');
            const byUserTable = document.getElementById('by-user-table');
            byUserTable.innerHTML = '';
            if (report.byUser && report.byUser.length > 0) {
                byUserSection.classList.remove('hidden');
                report.byUser.forEach(u => {
                    byUserTable.innerHTML += '<tr>' +
                        '<td>' + u.userId + '</td>' +
                        '<td class="income">' + formatMoney(u.income) + '</td>' +
                        '<td class="expense">' + formatMoney(u.expense) + '</td>' +
                        '<td>' + formatMoney(u.balance) + '</td></tr>';
                });
            } else {
                byUserSection.classList.add('hidden');
            }
        }

        function fillCategoryTable(tbodyId, categories) {
            const tbody = document.getElementById(tbodyId);
            tbody.innerHTML = '';
            if (!categories || Object.keys(categories).length === 0) {
                tbody.innerHTML = '<tr><td colspan="2">Нет данных</td></tr>';
                return;
            }
            for (const [name, amount] of Object.entries(categories)) {
                tbody.innerHTML += '<tr><td>' + name + '</td><td>' + formatMoney(amount) + '</td></tr>';
            }
        }

        async function exportCsv() {
            if (!validate()) return;
            const type = document.getElementById('report-type').value;
            if (type === 'full') {
                document.getElementById('report-error').textContent =
                    'Экспорт CSV доступен для личного отчёта и отчёта по группе';
                return;
            }
            try {
                const path = type === 'family' ? '/api/reports/family/export' : '/api/reports/personal/export';
                const resp = await apiRequest(path, {
                    method: 'POST',
                    body: JSON.stringify(getReportBody())
                });
                if (!resp) return;

                if (!resp.ok) {
                    document.getElementById('report-error').textContent = 'Ошибка экспорта: ' + resp.status;
                    return;
                }

                const blob = await resp.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'report.csv';
                a.click();
                window.URL.revokeObjectURL(url);
            } catch (err) {
                document.getElementById('report-error').textContent = 'Ошибка экспорта: ' + err.message;
            }
        }

        loadFamilies();
    </script>
</body>
</html>
