<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход - Family Finance</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body class="login-page">
    <div class="login-card">
        <h2>Family Finance</h2>

        <div class="tabs">
            <button class="active" onclick="showTab('login')">Вход</button>
            <button onclick="showTab('register')">Регистрация</button>
        </div>

        <div id="login-form">
            <form onsubmit="handleLogin(event)">
                <input type="email" id="login-email" placeholder="Email" required>
                <input type="password" id="login-password" placeholder="Пароль" required>
                <button type="submit">Войти</button>
                <p id="login-error" class="error-msg"></p>
            </form>
        </div>

        <div id="register-form" class="hidden">
            <form onsubmit="handleRegister(event)">
                <input type="email" id="reg-email" placeholder="Email" required>
                <input type="password" id="reg-password" placeholder="Пароль (мин. 6 символов)" required minlength="6">
                <input type="text" id="reg-first" placeholder="Имя" required>
                <input type="text" id="reg-last" placeholder="Фамилия" required>
                <button type="submit">Зарегистрироваться</button>
                <p id="reg-error" class="error-msg"></p>
            </form>
        </div>
    </div>

    <script src="/app.js"></script>
    <script>
        if (getToken()) {
            window.location.href = '/dashboard';
        }

        function showTab(tab) {
            document.getElementById('login-form').classList.toggle('hidden', tab !== 'login');
            document.getElementById('register-form').classList.toggle('hidden', tab !== 'register');
            document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
        }

        async function handleLogin(e) {
            e.preventDefault();
            try {
                await login(
                    document.getElementById('login-email').value,
                    document.getElementById('login-password').value
                );
                window.location.href = '/dashboard';
            } catch (err) {
                document.getElementById('login-error').textContent = err.message;
            }
        }

        async function handleRegister(e) {
            e.preventDefault();
            try {
                await register(
                    document.getElementById('reg-email').value,
                    document.getElementById('reg-password').value,
                    document.getElementById('reg-first').value,
                    document.getElementById('reg-last').value
                );
                window.location.href = '/dashboard';
            } catch (err) {
                document.getElementById('reg-error').textContent = err.message;
            }
        }
    </script>
</body>
</html>
