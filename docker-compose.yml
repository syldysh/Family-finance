services:
  postgres-auth:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: REDACTED_DATABASE_PASSWORD
    ports:
      - "5432:5432"
    volumes:
      - auth-data:/var/lib/postgresql/data

  postgres-finance:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: finance_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: REDACTED_DATABASE_PASSWORD
    ports:
      - "5433:5432"
    volumes:
      - finance-data:/var/lib/postgresql/data

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      - postgres-auth

  finance-service:
    build:
      context: .
      dockerfile: finance-service/Dockerfile
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-REDACTED_INTERNAL_TOKEN}
    depends_on:
      - postgres-finance
      - auth-service

  report-service:
    build:
      context: .
      dockerfile: report-service/Dockerfile
    ports:
      - "8083:8083"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-REDACTED_INTERNAL_TOKEN}
    depends_on:
      - finance-service

volumes:
  auth-data:
  finance-data:
